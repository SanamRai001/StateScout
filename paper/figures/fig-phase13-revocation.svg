<line class="axis" x1="80" y1="80" x2="80" y2="300"/>
<line class="axis" x1="80" y1="300" x2="570" y2="300"/>
<text class="small" x="68" y="304" text-anchor="end">0.0</text>
<text class="small" x="68" y="194" text-anchor="end">0.5</text>
<text class="small" x="68" y="84" text-anchor="end">1.0</text>
<rect class="bar" x="150" y="190" width="100" height="110"/>
<text class="label" x="200" y="180" text-anchor="middle">0.5</text>
<text class="label" x="200" y="324" text-anchor="middle">Stale trusted profile</text>
<text class="small" x="200" y="342" text-anchor="middle">2 states / 3 transitions</text>
<rect class="bar" x="410" y="80" width="100" height="220"/>
