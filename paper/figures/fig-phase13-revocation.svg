<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390" role="img">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}
.title{font-size:18px;font-weight:700}
