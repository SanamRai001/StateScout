name: Paper PDF

on:
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-icst-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures

      - name: Compile ICST draft
        working-directory: paper/icst2027
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | grep '^Pages:'

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: statescout-icst2027-pdf
          path: paper/icst2027/main.pdf
          if-no-files-found: error
