name: Paper PDF

on:
  push:
    branches:
      - "paper/related-work-novelty-v1"
    paths:
      - "paper/**"
      - ".github/workflows/paper-build.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-icst-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run paper submission audits
        run: npm run paper:submission-gate

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-publishers

      - name: Compile ICST draft
        working-directory: paper/icst2027
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | grep '^Pages:'

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: statescout-icst2027-pdf
          path: paper/icst2027/main.pdf
          if-no-files-found: error
