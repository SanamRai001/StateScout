<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dashboard — refresh 1</title></head>
<body>
<main id="app"></main>
<script>
const app = document.querySelector("#app");
const match = location.hash.match(/^#(baseline|stable|evolved)-(\d+)$/);
const mode = match?.[1] ?? "baseline";
let refresh = match ? Number(match[2]) : 1;
let state = "dashboard";

function button(label, action) {
  return `<button type="button" data-action="${action}">${label}</button>`;
}

function detailsHeading() {
  if (mode !== "evolved") return "Dashboard details";
  return refresh % 2 === 0
    ? "Dashboard priority details"
    : "Dashboard standard details";
}

function render() {
  if (state === "details") {
    const heading = detailsHeading();
    document.title = heading;
    app.innerHTML = `<h1>${heading}</h1>${button("Back", "back")}`;
    return;
  }

  document.title = `Dashboard — refresh ${refresh}`;
  app.innerHTML =
    `<h1>Dashboard</h1>${button("Refresh view", "refresh")}${button("Inspect dashboard", "inspect")}`;
}

app.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;

  const action = target.dataset.action;
  if (action === "refresh") {
    refresh += 1;
  } else if (action === "inspect") {
    state = "details";
  } else if (action === "back") {
    state = "dashboard";
  }

  render();
});

render();
</script>
</body>
</html>
